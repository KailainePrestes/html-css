<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio do astronauta</title>
    <style>
        * {
            padding: 0;
            margin: 0;
        }

        #espaco {
            background-image: url(img/espaco.jpg);
            background-size: 100% 100%;
            position: relative;
            height: 100vh;
        }

        #astronauta {
            background-image: url(img/astronauta.png);
            background-size: 100% 100%;
            position: absolute;

            height: 400px;
            width: 400px;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);
        }
    </style>
</head>

<body>
    <main id="espaco">
        <section id="astronauta">

        </section>
    </main>
</body>

</html>
