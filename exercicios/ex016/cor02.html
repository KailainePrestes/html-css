<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradiente em CSS</title>
    <style>
       *{ /* Configurações globais das CSS*/
        height: 100%;
       }
       body{ /* Pode usar 00deg ou to right/left/top/bottom*/
        background-image:  linear-gradient(46deg, #3198E2, #6D59C0, #b93590);
        background-attachment: fixed;
       }
    </style>
</head>
<body>
    <h1>Testando Gradiente</h1>
</body>
</html>
