<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Externas</title>
    <style>
        @font-face {
            font-family: 'Love';
            src: url('fonts/love story ttf.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;

            /*
                Tipos de format()
                - opentype (otf)
                - truetype (ttf)
                - embedded-opentype
                -truetype- aat (
                Apple Advanced Typography)
                -svg            
            */
        }
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        h1{
            font-family: 'Love', Times, serif;
            font-size: 3em;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <h1>Fonte Personalizada</h1>
     <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Assumenda ab consectetur ratione quasi perferendis cupiditate libero eius sapiente provident officia earum temporibus nostrum, eligendi ullam labore repellat doloribus inventore expedita!</p>

</body>
</html>
